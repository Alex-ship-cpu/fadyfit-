name: Build iOS IPA for Sideloadly

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        working-directory: app
        run: |
          npm ci
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Build Web Application
        working-directory: app
        run: npm run build

      - name: Initialize Capacitor iOS Project
        working-directory: app
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Build & Package IPA for Sideloadly
        working-directory: app
        run: |
          cd ios/App
          # Build archive
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

          # Package Payload into .ipa
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r FadyFit.ipa Payload
          mv FadyFit.ipa ../../../FadyFit.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FadyFit-iOS-IPA
          path: FadyFit.ipa
          retention-days: 7
